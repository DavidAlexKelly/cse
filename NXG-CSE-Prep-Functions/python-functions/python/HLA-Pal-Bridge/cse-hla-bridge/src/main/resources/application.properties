[main/resources/application.properties]

# CSE HLA Bridge configuration.
#
# Every bridge.* property below is bound via @Value in BridgeApplication.java
# and EtrTaskSender.java. Most are overridden by an environment variable in
# deployment; the ${VAR:default} syntax means "use VAR if set, else default".

# Spring Boot REST API port.
server.port=8080

# --- Environment / addressing --------------------------------------------

# Single digit (1-9) identifying the CSE-Prep environment. Used to derive
# both the CRC and FedPro addresses from a fixed port pattern, so switching
# environments only requires changing this one value.
bridge.cse-environment=${CSE_ENVIRONMENT:1}

# Explicit overrides. When set, these always win over the addresses derived
# from bridge.cse-environment.
bridge.crc-address=${CRC_ADDRESS:}
bridge.fedpro-address=${FEDPRO_ADDRESS:}

# Transport for the FedPro connection: "tcp" or "tls".
bridge.fedpro-protocol=${FEDPRO_PROTOCOL:tcp}

# SNI hostname to present during a TLS handshake to the FedPro server.
# Blank means no SNI is sent.
bridge.fedpro-sni-hostname=${FEDPRO_SNI_HOSTNAME:}

# The address this LRC advertises to the CRC for callbacks. Left blank, the
# LRC derives one itself; set explicitly when that derived address is not
# reachable from the CRC's side.
bridge.lrc-advertised-address=${LRC_ADVERTISED_ADDRESS:}

# How long to wait for the FedPro transport to establish before giving up.
bridge.fedpro-connect-timeout-seconds=${FEDPRO_CONNECT_TIMEOUT_SECONDS:10}

# --- Federation ------------------------------------------------------------

bridge.federation-name=${FEDERATION_NAME:CSE-Prep}

# Directory or single file containing the FOM modules to load / contribute
# on join.
bridge.fom-path=${FOM_PATH:/app/foms}

# Path to the NETN MIM XML. Only used if this bridge creates the federation.
# Blank means the RTI's standard MIM is used instead, which has no UniqueId
# attribute.
bridge.mim-path=${MIM_PATH:}

# How many times to retry a failed connect attempt (not counting waits for
# an absent federation, which are retried indefinitely) and how long to
# sleep between attempts.
bridge.retry-attempts=${BRIDGE_RETRY_ATTEMPTS:60}
bridge.retry-delay-seconds=${BRIDGE_RETRY_DELAY_SECONDS:10}

# Whether to create the federation execution if it does not already exist.
# Should stay false unless this bridge is deliberately standing in for the
# simulators, since creating one silently produces an empty, lonely
# federation that looks identical to a subscription bug.
bridge.create-federation=${BRIDGE_CREATE_FEDERATION:false}

# Whether to connect automatically at startup, or wait idle for a
# /reconnect call before taking an RTI seat.
bridge.auto-connect=${BRIDGE_AUTO_CONNECT:true}

# Federate identity. A suffix is appended automatically if this name is
# already registered in the federation.
bridge.federate-name=${FEDERATE_NAME:CSE-HLA-Bridge}

# "full" (default) or "monitor". Monitor mode subscribes to entity state
# and reports only; it publishes and tasks nothing.
bridge.mode=${BRIDGE_MODE:full}

# --- Subscriptions -----------------------------------------------------------

# Whether to subscribe to the HLAobjectRoot.BaseEntity catch-all class.
# Leave false: on this RTI, subscribing it causes every object to be
# discovered at BaseEntity regardless of its actual class, which limits
# every entity to BaseEntity's eight attributes. Turn on only to identify
# an object published as an unenumerated class, then turn back off.
bridge.subscribe-base-entity=${BRIDGE_SUBSCRIBE_BASE_ENTITY:false}

# How often (seconds) to re-request current attribute values for
# incompletely-reported instances. 0 disables the periodic refresh.
bridge.attribute-refresh-seconds=${BRIDGE_ATTRIBUTE_REFRESH_SECONDS:5}

# Upper bound on how many instances are asked per refresh cycle, to avoid
# saturating the LRC's outbound queue on a federation with many objects.
# 0 means no cap.
bridge.attribute-refresh-max-requests=${BRIDGE_ATTRIBUTE_REFRESH_MAX_REQUESTS:20}

# --- Time management --------------------------------------------------------

# Off by default: this bridge is a passive observer plus an out-of-band
# tasking channel and never requests a time advance. Enabling this without
# a real time-advance loop would stall every time-constrained federate.
bridge.time-management-enabled=${BRIDGE_TIME_MANAGEMENT:false}

# --- Tasking identity --------------------------------------------------------

# v2-era Tasker is a callsign string.
bridge.tasker-callsign=${TASKER_CALLSIGN:CSE-Bridge}

# v4 Tasker is a UUID referencing the commanding entity. Blank omits the
# parameter, which the FOM defines as "commander undefined".
bridge.tasker-uuid=${TASKER_UUID:}

# Default federate to address for v2 MRM aggregate/disaggregate requests
# when the caller does not supply one.
bridge.mrm-federate=${MRM_FEDERATE:}

# "auto" (default), "v2" or "v4". A forced value the loaded FOM does not
# define disables tasking rather than sending classes nothing can receive.
# v2 support has been removed from selection; only "auto" and "v4" are
# meaningful.
bridge.task-dialect=${BRIDGE_TASK_DIALECT:auto}

# DIS site/application identity this bridge uses when sending RPR
# simulation-management interactions (StartResume / StopFreeze).
bridge.dis-site-id=${BRIDGE_DIS_SITE_ID:1}
bridge.dis-application-id=${BRIDGE_DIS_APPLICATION_ID:1}

# --- Diagnostics --------------------------------------------------------------

# Runs a one-off connectivity probe against the environment's known ports
# at startup, from this pod's own network position. Purely diagnostic;
# never affects connection behaviour.
bridge.port-probe-enabled=${PORT_PROBE_ENABLED:true}

# --- Logging ------------------------------------------------------------------

logging.level.root=INFO
logging.level.com.decho.cse.bridge=INFO
# The FedPro client logs via java.util.logging, bridged into SLF4J at
# startup; this controls what actually reaches the log once bridged.
logging.level.se.pitch.oss.fedpro=INFO