package:
  name: python-example
  version: '{{ PACKAGE_VERSION }}'
source:
  path: ../python
requirements:
  build:
  - setuptools
  run:
  - functions-python-api >={{ FUNCTIONS_PYTHON_API_VERSION }}, <1
  - grpcio==1.62.0
  - ontology_sdk==0.5.0
build:
  script: python setup.py install --single-version-externally-managed --record=record.txt
  noarch: python
